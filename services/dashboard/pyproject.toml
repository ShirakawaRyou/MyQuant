[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "myquant-dashboard"
version = "0.1.0"
description = "Authenticated IBKR paper-account dashboard and independent durable worker"
requires-python = ">=3.12,<3.14"
dependencies = [
  "myquant",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "ib-async>=2.1,<3",
  "filelock>=3.20,<4",
  "psutil>=7,<8",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "playwright>=1.50,<2"]

[tool.uv.sources]
myquant = {path = "../..", editable = true}

[project.scripts]
myquant-web = "myquant_dashboard.web:main"
myquant-worker = "myquant_dashboard.worker:main"
myquant-admin = "myquant_dashboard.admin:main"
myquant-local = "myquant_dashboard.local:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
